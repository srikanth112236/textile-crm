version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ecom-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecom
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecom-network

  redis:
    image: redis:7.2-alpine
    container_name: ecom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecom-network
    command: redis-server --appendonly yes

  # Elasticsearch (for Phase 3)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ecom-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecom-network

volumes:
  mongodb_data:
  redis_data:
  elasticsearch_data:

networks:
  ecom-network:
    driver: bridge

