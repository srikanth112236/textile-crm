services:
  - name: ecom-backend
    type: web
    env: docker
    region: oregon
    plan: standard
    runtime: docker
    dockerfilePath: ./backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: MFA_ISSUER
        value: E-Commerce Platform
      - key: HTTPS_ENABLED
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_MERCHANT_ID
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - name: ecom-frontend
    type: web
    env: docker
    region: oregon
    plan: standard
    runtime: docker
    dockerfilePath: ./frontend.Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
